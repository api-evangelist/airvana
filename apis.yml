name: Airvana
description: 'Airvana was a Chelmsford, Massachusetts wireless infrastructure company founded in 2000 by
  former Motorola engineers Sanjeev Verma and Vedat Eyuboglu, building femtocells and small cells for 3G
  CDMA2000 EV-DO and 4G LTE mobile broadband networks. Its access points extended operator coverage inside
  buildings over consumer broadband connections, and the company was a founding member of the Femto Forum
  and an active contributor to femtocell standards. Airvana went public on NASDAQ (AIRV) in July 2007, was
  taken private in 2010, and was acquired by CommScope in 2015. It no longer operates as an independent
  company: the airvana.com apex serves no site, www.airvana.com now points into CommScope infrastructure,
  and there is no Airvana developer portal, public API, or SDK. Its femtocell and device management products
  were TR-069 based operator systems rather than public web APIs.'
